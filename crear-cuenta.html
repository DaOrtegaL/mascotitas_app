<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <title>Document</title>
  </head>

  <body>
    <header-mascotitas></header-mascotitas>
    <main class="main">
      <div class="main__titulo">
        <h2>Crea tu nueva cuenta</h2>
      </div>
      <form class="main__informacion" id="registro">
        <p>¿Ya tienes una cuenta con nosotros? <a href="/inicio-sesion">Ingresa aquí</a></p>

        <p class="seccion"><span>1</span> Información personal</p>

        <div class="main__informacion--personal">
          <div class="nombres">
            <input
              type="text"
              class="form-control"
              id="nombre"
              placeholder="Nombre"
              required
            />
            <input
              type="text"
              class="form-control"
              id="apellido"
              placeholder="Apellido"
              required
            />
          </div>
          <select class="lista" aria-label="Default select example"  id="tipoContribuyente">
            <option selected>Tipo de contribuyente</option>
            <option value="1">Cédula de ciudadanía</option>
            <option value="2">Cédula de extrangería</option>
            <option value="3">NIT</option>
            <option value="3">Pasaporte</option>
            <option value="3">Documento de identificación extranjero</option>
          </select>
          <div class="documento">
            <input
              type="number"
              class="form-control"
              id="numero-documento"
              placeholder="No. de documento de identidad"
              required
            />
          </div>
          <div class="direccion">
            <input
              type="text"
              class="form-control"
              id="inputAddress2"
              placeholder="Direccion"
            />
          </div>
          <div class="info-adicional">
            <input
              type="text"
              class="form-control"
              id="Informacion-adicional"
              placeholder="Informacion adicional"
            />
          </div>
        </div>

        <p class="seccion"><span>2</span> Información de inicio de sesión</p>

        <div class="main__informacion--sesion">
          <div class="email">
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Correo electrónico"
              required
            />
          </div>
          <div class="contrasena">
            <div class="password-wrapper">
              <input
                type="password"
                id="inputPassword"
                class="contrasena-input"
                placeholder="Contraseña"
                required
              />
              <img
                id="eyeIcon"
                src="../../public/images/icons/mostrar.svg"
                alt="Mostrar contraseña"
                class="toggle-password"
              />
            </div>
            <div class="password-wrapper">
              <input
                type="password"
                id="inputConfirmPassword"
                class="contrasena-input"
                placeholder="Confirmar contraseña"
                required
              />
              <img
                id="eyeIcon_2"
                src="../../public/images/icons/mostrar.svg"
                alt="Mostrar contraseña"
                class="toggle-password"
              />
            </div>
          </div>
          <div class="checkbox">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="check"
              required
            />
            <label class="form-check-label" for="check">
              Acepto terminos y condiciones *
            </label>
          </div>
          <button class="boton" type="submit">Crear cuenta</button>
        </div>
      </form>
      <img
        src="/public/images/huella-1 1.png"
        alt="Huella"
        class="main__huella--cuenta"
      />
      <img
        src="/public/images/hueso.png"
        alt="Hueso"
        class="main__hueso--cuenta"
      />
      <img
        src="/public/images/media-mancha-beige.png"
        alt="Mancha Beige"
        class="main__manchab"
      />
      <img
        src="/public/images/mancha-gris 1.png"
        alt="Mancha Gris"
        class="main__manchag"
      />
    </main>
    <footer-mascotitas></footer-mascotitas>
    <script type="module" src="/src/js/footer.js"></script>
    <script type="module" src="/src/js/header.js"></script>
    <script type="module" src="/src/js/toogle_password.js"></script>
    <script type="module" src="/src/js/crear-cuenta.js"></script>
  </body>
</html>
